<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DG7STORE - Painel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="text-white">
    <div class="user-background"></div>
    <div class="vignette-overlay"></div>
    
    <div id="infoModal" class="info-modal">
        <div class="glass-panel">
            <h3 style="margin-bottom: 20px; font-size: 18px;">Detalhes do Cartão</h3>
            <div id="info-content"></div>
            <button class="button-secondary" onclick="fecharInfo()" style="margin-top: 20px; width: 100%;">FECHAR</button>
        </div>
    </div>

    <div id="profileModal" class="info-modal">
        <div class="glass-panel">
            <h3 style="margin-bottom: 10px; font-size: 16px;">Atualizar Foto</h3>
            <p style="font-size: 10px; margin-bottom: 15px; color: var(--text-main);">Cole a URL da nova imagem (Imgur, Postimages, etc).</p>
            <input type="text" id="nova-foto-url" placeholder="URL da Foto...">
            <button class="button-primary" onclick="salvarNovaFoto()" style="margin-top: 15px;">Atualizar</button>
            <button class="button-secondary" onclick="fecharModalPerfil()">Cancelar</button>
        </div>
    </div>

    <div class="page-shell">
        <div class="glass-panel" style="padding: 20px 15px;">
            
            <div class="panel-header" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start;">
                <div class="logo-font" style="font-size: 2.2rem; margin-top: 5px; display: flex; align-items: baseline;">
                    <span class="text-silver">DG</span><span class="text-gold">7</span>
                    <span class="text-silver" style="font-size: 1.3rem; margin-left: 6px;">STORE</span>
                </div>
                
                <div class="gta-hud">
                    <img id="profile-img" src="https://i.imgur.com/cFlziwn.jpeg" alt="Perfil" title="Mudar Foto" onclick="abrirModalPerfil()">
                    <div class="gta-money">$<span id="saldo-display">0.00</span></div>
                </div>
            </div>
            
            <div style="display:flex; justify-content:flex-start; margin-bottom: 15px;">
                <button class="button-secondary" onclick="logout()" style="width:auto; padding: 6px 12px; font-size:10px;">Desconectar</button>
            </div>

            <div class="menu-tabs" style="margin: 10px 0;">
                <button id="tab-store" class="tab-button tab-active" onclick="selectTab('store')">Busca</button>
                <button id="tab-balance" class="tab-button" onclick="selectTab('balance')">Carteira</button>
                <button id="tab-history" class="tab-button" onclick="selectTab('history')">Histórico</button>
            </div>

            <div id="section-store" class="section-pane">
                <div id="dynamic-buttons-container" style="display:flex; flex-direction:column; gap:8px; margin-bottom: 20px;"></div>

                <hr style="border: 1px dashed rgba(255,255,255,0.12); margin: 20px 0;">

                <div class="flex-row" style="gap: 6px;">
                    <input type="text" id="bin-search" placeholder="Buscar BIN, País, Banco, Classe..." oninput="buscarBinLive()">
                </div>
                <div id="live-search-results" style="display:flex; flex-direction:column; gap:10px; margin-top:15px;">
                    <div style="text-align:center; font-size:11px; color:var(--text-main); margin-top:10px;">
                        Comece a digitar para ver os cartões disponíveis no estoque.
                    </div>
                </div>
            </div>

            <div id="section-balance" class="section-pane section-hidden">
                <h3 style="margin-top: 10px; font-size: 14px;">Resgatar Código</h3>
                <div class="flex-row">
                    <input type="text" id="resgate-codigo" placeholder="Código">
                    <button class="button-secondary" onclick="resgatarCodigo()" style="width: auto;">Resgatar</button>
                </div>
            </div>

            <div id="section-history" class="section-pane section-hidden">
                <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:12px;">
                    <h3 style="margin: 0; font-size: 14px;">Meus Cartões</h3>
                    <button class="button-danger" onclick="limparHistorico()" style="width: auto; padding: 6px 10px; font-size: 10px; margin: 0;">Excluir Todos</button>
                </div>
                
                <p id="history-count" class="text-center" style="margin-bottom: 5px; font-size:12px; color: var(--primary-neon);">0 / 0</p>
                
                <div class="carousel-container">
                    <button id="nav-prev" class="carousel-btn" onclick="navHistory(-1)"><i class="ph-bold ph-caret-left"></i></button>
                    <div id="card-preview" class="cc-preview-card" onclick="copiarCartaoAtual()" title="Toque para copiar"></div>
                    <button id="nav-next" class="carousel-btn" onclick="navHistory(1)"><i class="ph-bold ph-caret-right"></i></button>
                </div>
                
                <div id="history-list" class="history-list"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAt7cAOc3I02wg31EHq39aQigYY_CyxtkY", authDomain: "dg7store-c9636.firebaseapp.com", projectId: "dg7store-c9636", storageBucket: "dg7store-c9636.firebasestorage.app", messagingSenderId: "118364909075", appId: "1:118364909075:web:e861cc89702144e62d99e6" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null; let currentSaldo = 0; let historyData = []; let currentHistoryIdx = 0;
        let storeCache = [];

        auth.onAuthStateChanged(user => { 
            if (user) { currentUser = user; loadProfile(); loadHistory(); loadStoreCache(); loadDynamicButtons(); } 
            else { window.location.href = "index.html"; } 
        });

        function loadProfile() {
            db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
                const data = doc.data(); currentSaldo = data.saldo || 0;
                document.getElementById('saldo-display').innerText = currentSaldo.toFixed(2);
                if (data.avatarUrl) { document.getElementById('profile-img').src = data.avatarUrl; }
            });
        }
        function abrirModalPerfil() { document.getElementById('profileModal').classList.add('active'); }
        function fecharModalPerfil() { document.getElementById('profileModal').classList.remove('active'); document.getElementById('nova-foto-url').value = ''; }
        function salvarNovaFoto() {
            const url = document.getElementById('nova-foto-url').value.trim(); if(!url) return;
            db.collection('users').doc(currentUser.uid).update({avatarUrl: url}).then(()=>{ fecharModalPerfil(); alert('Foto atualizada!'); });
        }
        
        function loadStoreCache() {
            db.collection('store_db').where('status', '==', 'available').onSnapshot(snap => {
                storeCache = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })); buscarBinLive(); 
            });
        }

        function loadDynamicButtons() {
            db.collection('store_buttons').orderBy('createdAt', 'desc').onSnapshot(snap => {
                const container = document.getElementById('dynamic-buttons-container');
                container.innerHTML = '';
                snap.forEach(doc => {
                    const b = doc.data();
                    
                    // Bloqueio de proteção para não quebrar o layout do cliente se existir botão velho/inválido
                    if(!b.regras || !Array.isArray(b.regras)) return;
                    
                    const tituloFormat = b.titulo || "Botão Especial";
                    const precoFormat = b.preco ? b.preco.toFixed(2) : "0.00";

                    container.innerHTML += `<button class="button-primary" style="margin: 0;" onclick="executarCompraSegura('${doc.id}')">${tituloFormat} (R$ ${precoFormat})</button>`;
                });
            });
        }

        async function executarCompraSegura(btnId) {
            const btnDoc = await db.collection('store_buttons').doc(btnId).get();
            if(!btnDoc.exists) return alert("Erro: Botão não encontrado ou desativado.");
            const btnData = btnDoc.data();
            
            if(currentSaldo < btnData.preco) return alert('Saldo insuficiente. Recarregue sua carteira.');
            if(!btnData.regras || !Array.isArray(btnData.regras)) return alert('Botão fora de operação.');
            
            let tempCache = [...storeCache];
            let cardsToBuy = [];

            for(let r of btnData.regras) {
                let matches = tempCache.filter(c => {
                    if(r.tipoBusca === 'BIN') {
                        return String(c.bin || c.numero).startsWith(r.bin);
                    } else {
                        const mBand = r.bandeira === 'QUALQUER' || String(c.bandeira).toUpperCase() === String(r.bandeira).toUpperCase();
                        const mPais = r.pais === 'QUALQUER' || String(c.pais).toUpperCase() === String(r.pais).toUpperCase();
                        const mClas = r.classe === 'QUALQUER' || String(c.classe).toUpperCase() === String(r.classe).toUpperCase();
                        const mBanc = r.banco === 'QUALQUER' || String(c.banco).toUpperCase() === String(r.banco).toUpperCase();
                        const mTipo = r.tipo === 'QUALQUER' || String(c.tipo).toUpperCase() === String(r.tipo).toUpperCase();
                        return mBand && mPais && mClas && mBanc && mTipo;
                    }
                });

                if(matches.length < r.qtd) {
                    let desc = r.tipoBusca === 'BIN' ? `BIN ${r.bin}` : `${r.pais!=='QUALQUER'?r.pais:''} ${r.bandeira!=='QUALQUER'?r.bandeira:''}`.trim() || 'Aleatórios';
                    return alert(`ESTOQUE INSUFICIENTE!\nO pacote requer ${r.qtd}x [${desc}].\nTemos apenas ${matches.length} disponíveis.`);
                }

                for(let i=0; i<r.qtd; i++) {
                    const rIdx = Math.floor(Math.random() * matches.length);
                    const selected = matches[rIdx];
                    cardsToBuy.push(selected);
                    tempCache = tempCache.filter(c => c.id !== selected.id);
                    matches.splice(rIdx, 1);
                }
            }
            
            if(!confirm(`Confirmar compra: "${btnData.titulo}" por R$ ${btnData.preco.toFixed(2)}?\nVocê receberá ${cardsToBuy.length} cartão(ões).`)) return;
            
            const batch = db.batch();
            const precoUnitario = btnData.preco / cardsToBuy.length;

            cardsToBuy.forEach(item => {
                const userCard = Object.assign({}, item, { boughtAt: firebase.firestore.FieldValue.serverTimestamp(), price: precoUnitario });
                const userRef = db.collection('users').doc(currentUser.uid).collection('cards').doc();
                batch.set(userRef, userCard);
                const storeRef = db.collection('store_db').doc(item.id);
                batch.delete(storeRef);
            });

            const userBalRef = db.collection('users').doc(currentUser.uid);
            batch.update(userBalRef, { saldo: firebase.firestore.FieldValue.increment(-btnData.preco) });

            batch.commit().then(() => {
                currentHistoryIdx = 0; alert('Compra concluída! Verifique seu histórico.'); selectTab('history');
            }).catch(e => alert('Erro crítico ao processar compra. Tente novamente.'));
        }

        function selectTab(tab) {
            document.getElementById('tab-store').classList.toggle('tab-active', tab === 'store');
            document.getElementById('tab-balance').classList.toggle('tab-active', tab === 'balance');
            document.getElementById('tab-history').classList.toggle('tab-active', tab === 'history');
            document.getElementById('section-store').classList.toggle('section-hidden', tab !== 'store');
            document.getElementById('section-balance').classList.toggle('section-hidden', tab !== 'balance');
            document.getElementById('section-history').classList.toggle('section-hidden', tab !== 'history');
        }

        function formatCardNumber(value) {
            const digits = String(value || '').replace(/\D/g, '').slice(0, 16);
            if (!digits) return '**** **** **** ****';
            const groups = []; for (let i = 0; i < digits.length; i += 4) groups.push(digits.slice(i, i + 4));
            return groups.join(' ');
        }

        function safeText(value, fallback) { const text = String(value || '').trim(); return text || fallback; }

        function buscarBinLive() {
            const input = document.getElementById('bin-search').value.trim();
            const container = document.getElementById('live-search-results');

            if (!input) { container.innerHTML = '<div style="text-align:center; font-size:11px; color:var(--text-main); margin-top:10px;">Comece a digitar para ver os cartões disponíveis no estoque.</div>'; return; }

            const matches = storeCache.filter(item => {
                if (/^\d+$/.test(input)) {
                    const docBin = String(item.bin || item.numero || '').substring(0, 6);
                    return docBin.startsWith(input);
                } else {
                    const str = input.toUpperCase();
                    return (
                        String(item.pais || '').toUpperCase().includes(str) || String(item.banco || '').toUpperCase().includes(str) ||
                        String(item.classe || '').toUpperCase().includes(str) || String(item.bandeira || '').toUpperCase().includes(str) || String(item.tipo || '').toUpperCase().includes(str)
                    );
                }
            });

            if (matches.length === 0) { container.innerHTML = '<div style="text-align:center; font-size:12px; color:var(--secondary-neon); margin-top:20px;">Nenhum cartão encontrado.</div>'; return; }

            const binsMap = {};
            matches.forEach(m => {
                if(m.price && m.price > 0) {
                    const b = String(m.bin || m.numero || '').substring(0,6);
                    if (!binsMap[b]) binsMap[b] = { count: 0, prices: new Set(), data: m };
                    binsMap[b].count++; binsMap[b].prices.add(m.price);
                }
            });

            container.innerHTML = '';
            
            Object.keys(binsMap).slice(0, 20).forEach(b => {
                const info = binsMap[b]; const d = info.data; const sortedPrices = Array.from(info.prices).sort((a,b) => a - b);
                
                let buttonsHtml = sortedPrices.map(p => `
                    <button class="button-primary" style="padding: 8px 10px; font-size: 11px; width: auto; flex: 1; margin: 0;" onclick="comprarManualBin('${b}', ${p})">COMPRAR R$ ${p.toFixed(2)}</button>
                `).join('');

                container.innerHTML += `
                <div class="live-search-card">
                    <div class="title">BIN ${b} <span style="font-size:10px; color:#fff; float:right;">Estoque: ${info.count}</span></div>
                    <div class="info">
                        <strong>${safeText(d.bandeira, 'CARD').toUpperCase()}</strong> • ${safeText(d.classe, 'STANDARD').toUpperCase()} • ${safeText(d.tipo, 'CREDITO').toUpperCase()}<br>
                        BANCO: <span style="color:#fff;">${safeText(d.banco, 'DESCONHECIDO').toUpperCase()}</span><br>
                        PAÍS: <span style="color:var(--primary-neon);">${safeText(d.pais, 'DESCONHECIDO').toUpperCase()}</span>
                    </div>
                    <div class="prices">${buttonsHtml}</div>
                </div>`;
            });
        }

        function comprarManualBin(binPrefix, priceStr) {
            const price = parseFloat(priceStr);
            if (currentSaldo < price) return alert("Saldo Insuficiente! Requer R$ " + price.toFixed(2));
            if (!confirm(`Deseja confirmar a compra deste cartão por R$ ${price.toFixed(2)}?`)) return;
            
            const match = storeCache.find(item => { const itemBin = String(item.bin || item.numero || '').substring(0,6); return itemBin === binPrefix && item.price === price; });
            if (!match) return alert("Este cartão acabou de ser vendido. Atualizando...");

            const userCard = Object.assign({}, match, { boughtAt: firebase.firestore.FieldValue.serverTimestamp() });
            
            db.collection('users').doc(currentUser.uid).collection('cards').add(userCard)
            .then(() => db.collection('store_db').doc(match.id).delete())
            .then(() => db.collection('users').doc(currentUser.uid).update({ saldo: firebase.firestore.FieldValue.increment(-price) }))
            .then(() => { currentHistoryIdx = 0; alert('Compra Concluída com Sucesso!'); selectTab('history'); }).catch(err => { alert('Erro na compra.'); });
        }

        function loadHistory() {
            db.collection('users').doc(currentUser.uid).collection('cards').orderBy('boughtAt', 'desc').onSnapshot(snap => {
                historyData = []; snap.forEach(doc => { const d = doc.data(); d._id = doc.id; if (!d.name || d.name.trim() === '') { d.name = "NOME DESCONHECIDO"; } historyData.push(d); });
                renderHistoryList(); renderPreviewCard();
            });
        }

        function renderPreviewCard() {
            const preview = document.getElementById('card-preview'); const count = document.getElementById('history-count');
            const prevBtn = document.getElementById('nav-prev'); const nextBtn = document.getElementById('nav-next');
            if (!preview) return;
            if (historyData.length === 0) { preview.innerHTML = '<div class="cc-empty">Nenhum cartão comprado.</div>'; count.innerText = '0 / 0'; prevBtn.disabled = true; nextBtn.disabled = true; return; }
            
            const data = historyData[currentHistoryIdx];
            preview.innerHTML = `
                <button class="info-btn" onclick="event.stopPropagation(); mostrarInfo()"><i class="ph-bold ph-info"></i></button>
                <div class="cc-top"><div class="cc-chip"></div><div class="cc-brand">${safeText(data.bandeira || data.classe, 'CARD').toUpperCase()}</div></div>
                <div class="cc-number">${formatCardNumber(data.numero)}</div>
                <div class="cc-name">${safeText(data.name, 'SEM NOME').toUpperCase()}</div>
                <div class="cc-footer"><div><span>VALID</span><strong>${safeText(data.exp, '**/**')}</strong></div><div><span>CVV</span><strong>${safeText(data.cvc, '***')}</strong></div></div>
            `;
            count.innerText = `${currentHistoryIdx + 1} / ${historyData.length}`;
            prevBtn.disabled = (historyData.length <= 1 || currentHistoryIdx === 0); nextBtn.disabled = (historyData.length <= 1 || currentHistoryIdx === historyData.length - 1);
        }

        function mostrarInfo() {
            if(!historyData.length) return; const data = historyData[currentHistoryIdx];
            const content = document.getElementById('info-content');
            content.innerHTML = `
                <div class="info-row"><strong>NOME:</strong> ${safeText(data.name, 'DESCONHECIDO')}</div>
                <div class="info-row"><strong>CEP/ZIP:</strong> ${safeText(data.cep, 'DESCONHECIDO')}</div>
                <div class="info-row"><strong>PAÍS:</strong> ${safeText(data.pais, 'DESCONHECIDO')}</div>
                <div class="info-row"><strong>BANCO:</strong> ${safeText(data.banco, 'DESCONHECIDO')}</div>
                <div class="info-row"><strong>CLASSE:</strong> ${safeText(data.classe, 'STANDARD')}</div>
                <div class="info-row"><strong>TIPO:</strong> ${safeText(data.tipo, 'CREDITO')}</div>
                <div class="info-row"><strong>BANDEIRA:</strong> ${safeText(data.bandeira, 'OUTRA')}</div>
            `;
            document.getElementById('infoModal').classList.add('active');
        }
        function fecharInfo() { document.getElementById('infoModal').classList.remove('active'); }

        function renderHistoryList() {
            const list = document.getElementById('history-list'); list.innerHTML = '';
            historyData.forEach((d, idx) => {
                const card = document.createElement('div');
                card.className = `history-card${idx === currentHistoryIdx ? ' active' : ''}`;
                card.style.cursor = 'pointer';
                card.innerHTML = `
                    <div class="card-top" style="margin-bottom: 4px;"><div class="card-num" style="font-size: 10px;">${formatCardNumber(d.numero)}</div><button onclick="event.stopPropagation(); apagarCompra('${d._id}')" class="button-danger" style="padding: 2px 6px; font-size: 10px; border-radius: 4px; margin: 0;">X</button></div>
                    <div class="card-body" style="font-size: 9px; margin-top:0;"><span style="color: #fff;">${safeText(d.classe, 'CARD').toUpperCase()}</span><br>VAL: ${safeText(d.exp, '**/**')}</div>
                `;
                card.onclick = () => { currentHistoryIdx = idx; renderHistoryList(); renderPreviewCard(); }; list.appendChild(card);
            });
        }

        function apagarCompra(docId) { if(!confirm('Remover este item?')) return; db.collection('users').doc(currentUser.uid).collection('cards').doc(docId).delete().then(() => { currentHistoryIdx = 0; }); }
        function limparHistorico() { if(!confirm('Apagar todo o histórico?')) return; const batch = db.batch(); historyData.forEach(item => { const ref = db.collection('users').doc(currentUser.uid).collection('cards').doc(item._id); batch.delete(ref); }); batch.commit().then(() => { currentHistoryIdx = 0; }); }
        function copiarCartaoAtual() {
            if (!historyData.length) return; const data = historyData[currentHistoryIdx];
            const text = `Nome: ${data.name || ''}\nNúmero: ${data.numero || ''}\nExp: ${data.exp || ''}\nCVC: ${data.cvc || ''}\nCEP: ${data.cep || ''}\nPaís: ${data.pais || ''}`;
            navigator.clipboard.writeText(text).then(() => { const preview = document.getElementById('card-preview'); preview.classList.add('copied'); setTimeout(() => preview.classList.remove('copied'), 900); });
        }
        function resgatarCodigo() {
            const code = document.getElementById('resgate-codigo').value.trim();
            if (!code) return alert('Digite um código.');

            const userRef = db.collection('users').doc(currentUser.uid);
            const codeRef = db.collection('codes').doc(code);

            db.runTransaction(async transaction => {
                const snap = await transaction.get(codeRef);
                if (!snap.exists) throw new Error('Código inválido.');

                const data = snap.data() || {};
                const remainingUses = Number(data.remainingUses ?? data.uses ?? 0);
                const value = Number(data.value || 0);

                if (data.status && data.status !== 'active') throw new Error('Código já foi utilizado ou está inativo.');
                if (!Number.isFinite(remainingUses) || remainingUses <= 0) throw new Error('Código sem usos restantes.');

                transaction.update(codeRef, {
                    remainingUses: firebase.firestore.FieldValue.increment(-1),
                    lastUsedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                if (remainingUses === 1) {
                    transaction.update(codeRef, { status: 'used' });
                }

                transaction.update(userRef, { saldo: firebase.firestore.FieldValue.increment(value) });
                return value;
            }).then(value => {
                alert(`Resgatado com sucesso! Seu saldo foi creditado em R$ ${Number(value).toFixed(2)}.`);
                document.getElementById('resgate-codigo').value = '';
            }).catch(err => {
                const message = err && err.message ? err.message : 'Não foi possível resgatar o código.';
                alert(message);
            });
        }
        function navHistory(dir) {
            if (!historyData.length) return;
            if (dir > 0) { currentHistoryIdx = Math.min(historyData.length - 1, currentHistoryIdx + 1); } else { currentHistoryIdx = Math.max(0, currentHistoryIdx - 1); }
            renderHistoryList(); renderPreviewCard();
        }
        function logout() { auth.signOut(); }
    </script>
</body>
</html>
