<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DG7STORE - ADMIN CORE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="text-white">
  <div class="user-background"></div>
  <div class="vignette-overlay"></div>
  <div class="page-shell">
      <div class="glass-panel" style="padding: 15px;">
          <div class="panel-header" style="margin-bottom: 15px;">
              <div class="logo-font"><span class="text-silver">DG</span><span class="text-gold">7</span><span class="text-silver">STORE</span></div>
              <p class="panel-subtitle" style="font-size: 10px;">Administração Central</p>
          </div>
          <div class="status-pill" id="db-status">CONECTANDO...</div>
      </div>

      <div class="glass-panel" id="auth-check" style="padding: 20px 15px; margin-top: 15px;">
          <h2 id="auth-title">Carregando...</h2>
          <input type="password" id="admin-pass" placeholder="Senha" style="display: none; font-size: 14px;">
          <button id="auth-btn" class="button-primary" onclick="handleAuth()" style="display: none; padding: 12px;">Acessar</button>
      </div>

      <div class="glass-panel hidden" id="admin-panel" style="padding: 20px 15px; margin-top: 15px;">
          <h3 style="color:var(--secondary-neon); font-size: 16px;">Extrator Master</h3>
          <p style="font-size: 10px; margin-bottom: 10px;">O extrator ignora caracteres estranhos, espaços ou barras (|) e separa os blocos de forma inteligente.</p>
          
          <textarea id="raw-text" rows="6" placeholder="Cole qualquer lixo/texto aqui..." style="width: 100%; box-sizing: border-box; font-size: 12px; padding: 10px; margin-bottom: 10px;"></textarea>
          
          <button class="button-primary" onclick="parseText()" style="padding: 12px;">Analisar e Extrair</button>
          
          <div id="parsed-results" style="margin-top:15px; font-size:12px; background:rgba(0,0,0,0.8); padding:15px; border:1px solid #111; border-radius: 8px;"></div>
          
          <button class="button-secondary" onclick="uploadToDB()" style="margin-top: 15px; padding: 12px;">Subir para o Banco Central</button>
          
          <hr style="border: 1px dashed rgba(255,255,255,0.12); margin: 25px 0;">

          <h3 style="font-size: 16px;">Gerador de Códigos</h3>
          <div class="flex-row" style="gap: 10px; margin-bottom: 10px;">
            <input type="number" id="code-value" placeholder="Valor (R$)" style="flex: 1; padding: 12px;">
            <input type="number" id="code-uses" placeholder="Qtd. Usos" style="flex: 1; padding: 12px;">
          </div>
          <button class="button-primary" onclick="generateCode()" style="padding: 12px;">Gerar Código</button>
          <div id="generation-status" class="status-pill" style="margin-top: 10px;">Pronto para gerar.</div>
          <div id="generated-code" style="text-align:center; font-size: 22px; color: var(--primary-neon); margin-top: 15px; font-weight: bold;">DG7-XXXX-XXXX</div>
      </div>
  </div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyAt7cAOc3I02wg31EHq39aQigYY_CyxtkY", authDomain: "dg7store-c9636.firebaseapp.com", projectId: "dg7store-c9636", storageBucket: "dg7store-c9636.firebasestorage.app", messagingSenderId: "118364909075", appId: "1:118364909075:web:e861cc89702144e62d99e6" };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();

    let isSetupMode = false;
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message); const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer); return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.onload = async function() {
        try {
            const doc = await db.collection('admin_config').doc('security').get();
            document.getElementById('admin-pass').style.display = 'block'; document.getElementById('auth-btn').style.display = 'block'; document.getElementById('db-status').innerText = 'ONLINE';
            if (doc.exists && doc.data().masterHash) { isSetupMode = false; document.getElementById('auth-title').innerText = "Senha Admin"; document.getElementById('auth-btn').innerText = "Acessar"; } 
            else { isSetupMode = true; document.getElementById('auth-title').innerText = "Criar Senha"; document.getElementById('auth-btn').innerText = "Criar"; }
        } catch (e) { document.getElementById('db-status').innerText = 'ERRO DE CONEXÃO'; }
    };

    async function handleAuth() {
        const pass = document.getElementById('admin-pass').value; if (!pass) return alert('Digite a senha.'); const hash = await sha256(pass);
        if (isSetupMode) { await db.collection('admin_config').doc('security').set({ masterHash: hash }); alert('Senha criada!'); liberarPainel(); isSetupMode = false; document.getElementById('auth-title').innerText = "Senha Admin"; document.getElementById('admin-pass').value = ''; } 
        else { const doc = await db.collection('admin_config').doc('security').get(); if (doc.data().masterHash === hash) { liberarPainel(); } else { alert('Senha Incorreta!'); } }
    }

    function liberarPainel() { document.getElementById('auth-check').classList.add('hidden'); document.getElementById('admin-panel').classList.remove('hidden'); }

    let parsedItems = []; let uniqueBins = new Set(); 

    function inferClasseFromNumber(num) {
      const first = String(num).charAt(0); const prefix = String(num).substring(0, 2);
      if (first === '4') return 'VISA'; if (prefix >= '51' && prefix <= '55' || prefix >= '22' && prefix <= '27') return 'MASTERCARD'; if (first === '3' && (String(num).startsWith('34') || String(num).startsWith('37'))) return 'AMEX'; return 'OUTRA';
    }

    async function inferMetaForBin(bin) {
      try { const response = await fetch(`https://lookup.binlist.net/${bin}`, { headers: { Accept: 'application/json' } }); if (!response.ok) throw new Error('offline'); const data = await response.json(); const classe = inferClasseFromNumber(bin); const bandeira = data && data.country && data.country.alpha2 === 'BR' ? 'NACIONAL' : 'INTERNACIONAL'; return { classe, bandeira, brand: data.brand || '', scheme: data.scheme || '' }; } 
      catch (e) { return { classe: inferClasseFromNumber(bin), bandeira: 'INTERNACIONAL' }; }
    }

    async function parseText() {
      const text = document.getElementById('raw-text').value; const lines = text.split(/\r?\n/).filter(Boolean);
      parsedItems = []; uniqueBins.clear();
      let outputHTML = '<h4 style="color:var(--text-main); margin-bottom: 8px;">Itens Extraídos:</h4><div style="margin-bottom:15px; font-size:11px; line-height: 1.4;">';

      for (const line of lines) {
        const match = line.match(/(\d{13,19})[\D]+(\d{2})[\D]+(\d{2,4})[\D]+(\d{3,4})/);
        if (!match) continue;
        const num = match[1]; const mes = match[2]; const anoStr = match[3]; const ano = anoStr.length === 2 ? '20' + anoStr : anoStr; const cvc = match[4]; const bin = num.substring(0, 6);
        uniqueBins.add(bin);
        parsedItems.push({ numero: num, exp: `${mes}/${ano}`, cvc, bin, bin_prefix: bin, status: 'available', owner: null, classe: 'OUTRA', bandeira: 'INTERNACIONAL' });
        outputHTML += `<strong>${num}</strong> | ${mes} | ${ano} | ${cvc}<br>`;
      }

      if (parsedItems.length > 1000) outputHTML += `<div style="margin-top:8px; color:#ff9b9b">Processando até ${parsedItems.length} itens.</div>`;
      outputHTML += '</div>';

      if (parsedItems.length > 0) {
          outputHTML += '<h4 style="color: var(--secondary-neon); margin-bottom: 10px; font-size: 14px;">Defina os Preços:</h4>';
          [...uniqueBins].forEach(bin => { 
              outputHTML += `<div style="margin-bottom: 12px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;"> 
              BIN <strong>${bin}</strong>: 
              <input type="number" id="price-${bin}" placeholder="R$ (Ex: 35.00)" style="width: 100%; padding: 12px; margin-top: 8px; font-size: 14px; box-sizing: border-box;"> 
              </div>`; 
          });
      }

      document.getElementById('parsed-results').innerHTML = outputHTML || 'Nenhum padrão encontrado. Verifique o texto.';

      if (parsedItems.length > 0) {
        const binList = [...uniqueBins]; const metaMap = {};
        for (const bin of binList) { const meta = await inferMetaForBin(bin); metaMap[bin] = meta; }
        parsedItems.forEach(item => { const meta = metaMap[item.bin] || {}; item.classe = meta.classe || inferClasseFromNumber(item.bin); item.bandeira = meta.bandeira || 'INTERNACIONAL'; item.bin_prefix = item.bin; });
      }
    }

    async function uploadToDB() {
      if (parsedItems.length === 0) return alert('Nada para subir.');
      let binPrices = {}; let allPricesValid = true;
      
      [...uniqueBins].forEach(bin => {
          let priceVal = parseFloat(document.getElementById(`price-${bin}`).value);
          if (isNaN(priceVal) || priceVal <= 0) { allPricesValid = false; }
          binPrices[bin] = priceVal;
      });

      if (!allPricesValid) return alert('ATENÇÃO: Preencha um valor válido (maior que zero) para TODAS as BINs.');

      const total = parsedItems.length; const batchSize = 500; let written = 0;

      for (let offset = 0; offset < total; offset += batchSize) {
        const batch = db.batch(); const slice = parsedItems.slice(offset, offset + batchSize);
        slice.forEach(item => { const docRef = db.collection('store_db').doc(); item.price = binPrices[item.bin]; batch.set(docRef, item); });
        await batch.commit(); written += slice.length;
      }

      alert(`${written} itens adicionados com sucesso!`);
      parsedItems = []; uniqueBins.clear(); document.getElementById('parsed-results').innerHTML = '';
      document.getElementById('raw-text').value = '';
    }

    function generateCode() {
      const val = parseFloat(document.getElementById('code-value').value); const uses = parseInt(document.getElementById('code-uses').value, 10);
      const statusBox = document.getElementById('generation-status'); const outputBox = document.getElementById('generated-code');
      if (!Number.isFinite(val) || val <= 0 || !Number.isInteger(uses) || uses <= 0) { statusBox.innerText = 'Preencha os valores.'; return alert('Preencha valor e usos válidos.'); }
      const charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let code = 'DG7-'; for (let i = 0; i < 8; i++) code += charset.charAt(Math.floor(Math.random() * charset.length));
      outputBox.innerText = code; statusBox.innerText = 'Código gravado com sucesso.';
      db.collection('codes').doc(code).set({ value: val, uses, createdAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(err => { statusBox.innerText = 'Falha no servidor.'; });
    }
  </script>
</body>
</html>
